name: verify-acceptance-items Python

on:
  pull_request:
    paths:
      - "skills/development/verify-acceptance-items/**"
      - "docs/development/verify-acceptance-items.md"
      - ".github/workflows/verify-acceptance-items-python.yml"
  push:
    branches: [main]
    paths:
      - "skills/development/verify-acceptance-items/**"
      - "docs/development/verify-acceptance-items.md"
      - ".github/workflows/verify-acceptance-items-python.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: skills/development/verify-acceptance-items
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.5"
          python-version: "3.12.14"
          enable-cache: true
      - run: uv python install 3.12.14
      - run: uvx --no-build ruff@0.16.5 format --check scripts tests
      - run: uvx --no-build ruff@0.16.5 check scripts tests
      - run: uv run --frozen --python 3.12.14 python -m unittest discover -s tests -v
