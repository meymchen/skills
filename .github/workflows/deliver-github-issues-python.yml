name: deliver-github-issues Python

on:
  pull_request:
    paths:
      - "skills/workflow/deliver-github-issues/**"
      - "docs/workflow/deliver-github-issues.md"
      - ".github/workflows/deliver-github-issues-python.yml"
  push:
    branches: [main]
    paths:
      - "skills/workflow/deliver-github-issues/**"
      - "docs/workflow/deliver-github-issues.md"
      - ".github/workflows/deliver-github-issues-python.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: skills/workflow/deliver-github-issues
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.3"
          python-version: "3.12"
          enable-cache: true
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check .
      - run: uv run --locked pytest
