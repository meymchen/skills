name: cleanup-merged-branch Python

on:
  pull_request:
    paths:
      - "skills/productivity/cleanup-merged-branch/**"
      - "docs/workflow/cleanup-merged-branch.md"
      - ".github/workflows/cleanup-merged-branch-python.yml"
  push:
    branches: [main]
    paths:
      - "skills/productivity/cleanup-merged-branch/**"
      - "docs/workflow/cleanup-merged-branch.md"
      - ".github/workflows/cleanup-merged-branch-python.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: skills/productivity/cleanup-merged-branch
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.3"
          python-version: "3.12"
          enable-cache: true
      - run: uvx ruff@0.14.0 format --check scripts tests
      - run: uvx ruff@0.14.0 check scripts tests
      - run: uv run --python 3.12 python -m unittest discover -s tests -v
